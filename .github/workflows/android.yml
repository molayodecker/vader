name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Elixir order lifecycle tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.1'
          elixir-version: '1.17.3'
          install-hex: false
          install-rebar: false

      - name: Run domain tests
        run: mix test --warnings-as-errors

  postgres:
    name: PostgreSQL payment and outbox tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: vader_test
          POSTGRES_DB: vader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vader_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: vader_test
      PGDATABASE: vader_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema
        run: psql -v ON_ERROR_STOP=1 -f backend/priv/sql/001_vending_orders.sql
      - name: Exercise payment and outbox constraints
        run: psql -v ON_ERROR_STOP=1 -f backend/test/sql/001_vending_orders_test.sql
      - name: Apply catalog and inventory migration
        run: psql -v ON_ERROR_STOP=1 -f backend/priv/sql/002_catalog_inventory.sql
      - name: Exercise inventory reservations and cancellation
        run: psql -v ON_ERROR_STOP=1 -f backend/test/sql/002_catalog_inventory_test.sql
